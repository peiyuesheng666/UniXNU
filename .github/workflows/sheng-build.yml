name: sheng build

on:
  workflow_dispatch:
    inputs:
      ramdisk:
        description: "payload ramdisk (none = boot.img without the XNU payload)"
        default: "none"
        required: false

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      UNIXNU_DEVICE: ${{ github.workspace }}/device
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out the sheng device repository
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          ref: main
          path: device

      - name: Check out the UEFI firmware
        uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: main
          path: uefi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Toolchain report
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          df -h "$GITHUB_WORKSPACE"

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      - name: Select the device
        run: ./unixnu defconfig sheng_defconfig

      - name: Fetch sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./unixnu fetch

      - name: Fetch the IPSW members
        run: ./unixnu ipsw fetch

      - name: Build kernel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./unixnu build kernel

      - name: Build package
        run: ./unixnu build package

      - name: Build firmware
        run: ./unixnu build firmware --uefi ../uefi

      - name: Build boot image
        run: ./unixnu bootimg --uefi ../uefi --dtb sheng/sheng.dtb --ramdisk "${{ inputs.ramdisk }}"

      - name: Show what was produced
        if: always()
        run: |
          find out -maxdepth 3 -type f \( -name '*.macho' -o -name '*.img' -o -name '*.json' -o -name '*.efi' \) -printf '%10s  %p\n' 2>/dev/null | sort -k2 || true

      - name: Upload kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheng-kernel
          path: |
            out/sheng/kernel/kernel.macho
            out/sheng/kernel/*.json
          if-no-files-found: warn

      - name: Upload boot image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheng-boot
          path: |
            out/sheng/boot/boot.img
            out/sheng/boot/boot.json
          if-no-files-found: warn

      - name: Upload EFI binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheng-efi
          path: |
            out/sheng/package/Build/Out
            out/sheng/firmware
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheng-logs
          path: out/sheng/logs/*.log
          if-no-files-found: warn
